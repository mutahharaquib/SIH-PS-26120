services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      TWIN_N_WELLS: "12"
      TWIN_DB: "sqlite:////data/twin.db"
    volumes: ["twin-data:/data", "./reports:/app/reports"]
    ports: ["8000:8000"]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["8080:80"]
  opcua-sim:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "-m", "integration.opcua_server_sim", "--wells", "4", "--port", "4840"]
    ports: ["4840:4840"]
volumes:
  twin-data: {}
